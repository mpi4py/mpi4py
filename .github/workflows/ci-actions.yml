name: ci-actions

on:  # yamllint disable-line rule:truthy
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  jactionlint:
    runs-on: ubuntu-latest

    steps:

    - name: checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: jactionlint
      uses: jdx/jactionlint@v2.6.0

  zizmor:
    runs-on: ubuntu-latest

    steps:

    - name: checkout
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: zizmor
      uses: zizmorcore/zizmor-action@v0.8.1
      with:
        annotations: true
        advanced-security: false
